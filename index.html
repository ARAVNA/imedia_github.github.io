<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chantre Adé Esther</title>

  <style>
    body{
      margin:0;
      background:linear-gradient(135deg,#4b0082,#6a0dad,#d4af37);
      color:white;
      font-family:Arial,sans-serif;
      text-align:center;
      padding:40px;
    }

    img{
      width:320px;
      max-width:90%;
      border-radius:25px;
      margin-top:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }

    video{
      width:320px;
      max-width:90%;
      border-radius:20px;
      margin-top:25px;
    }

    h1{
      font-size:48px;
    }

    .btn{
      display:inline-block;
      margin:10px;
      padding:15px 30px;
      background:gold;
      color:#4b0082;
      text-decoration:none;
      border-radius:15px;
      font-weight:bold;
    }
  </style>
</head>

<body>

  <h1>Chantre Adé Esther</h1>

  <p>
    Plateforme officielle de musique gospel,
    vidéos, concerts et contenus spirituels.
  </p>

  <a class="btn" href="#">Écouter les chants</a>
  <a class="btn" href="#">Réserver un concert</a>

  <br><br>

  <img src="ade-esther.jpeg" alt="Adé Esther">

  <br>

  <video controls>
    <source src="video.mp4" type="video/mp4">
  </video>

</body>
</html>
